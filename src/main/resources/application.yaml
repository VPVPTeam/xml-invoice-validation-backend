spring:
  application:
    name: XML Invoice Validation Backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/xml_invoice_validation_backend_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-at-least-32-chars-long}
    expiration-ms: 3600000

  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:admin12345}